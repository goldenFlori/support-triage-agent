[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-triage-agent"
version = "0.1.0"
description = "AI agent that triages e-commerce customer-support tickets with tools, guardrails and structured output."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
triage-agent = "triage_agent.cli:main"
triage-web = "triage_agent.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage_agent = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY)"]
